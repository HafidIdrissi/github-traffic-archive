<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">github-traffic-archive</title>
  <desc id="desc">An animated fourteen-day GitHub traffic window flowing into a permanent, verified archive.</desc>

  <defs>
    <linearGradient id="background" x1="64" y1="28" x2="1136" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B35"/>
      <stop offset="0.52" stop-color="#0A1021"/>
      <stop offset="1" stop-color="#081827"/>
    </linearGradient>
    <linearGradient id="headline" x1="122" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="flowGradient" x1="420" y1="0" x2="1030" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 102) rotate(135) scale(380 290)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="56" y="34" width="1088" height="352" rx="28"/>
    </clipPath>
  </defs>

  <style>
    .title { font: 700 43px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: -2px; }
    .eyebrow { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 2.1px; }
    .copy { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .micro { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .flow-line { animation: flow 2.8s linear infinite; }
    .signal { animation: signal 2.8s ease-in-out infinite; transform-origin: center; }
    .bar-a { animation: bars 3.2s ease-in-out infinite; transform-origin: center bottom; }
    .bar-b { animation: bars 3.2s ease-in-out -1.1s infinite; transform-origin: center bottom; }
    .bar-c { animation: bars 3.2s ease-in-out -2.1s infinite; transform-origin: center bottom; }
    .check { animation: check 2.8s ease-in-out infinite; transform-origin: 1010px 279px; }
    .cursor { animation: blink 1.1s steps(2, end) infinite; }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    @keyframes signal { 0%, 16% { opacity: 0; transform: scale(.65); } 30%, 76% { opacity: 1; transform: scale(1); } 92%, 100% { opacity: 0; transform: scale(.65); } }
    @keyframes bars { 0%, 100% { transform: scaleY(.72); opacity: .72; } 50% { transform: scaleY(1); opacity: 1; } }
    @keyframes check { 0%, 55% { transform: scale(.88); opacity: .55; } 67%, 88% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(.88); opacity: .55; } }
    @keyframes blink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) {
      .flow-line, .signal, .bar-a, .bar-b, .bar-c, .check, .cursor, .float { animation: none; }
    }
  </style>

  <rect width="1200" height="420" rx="34" fill="#070B16"/>
  <rect x="56" y="34" width="1088" height="352" rx="28" fill="url(#background)" stroke="#273455" stroke-width="2" filter="url(#shadow)"/>
  <g clip-path="url(#panelClip)">
    <rect x="56" y="34" width="1088" height="352" fill="url(#glow)"/>
    <path d="M48 322C225 230 335 388 531 303C743 211 903 357 1162 218" fill="none" stroke="#273455" stroke-opacity="0.34" stroke-width="1.5"/>
    <path d="M31 132C240 42 385 182 591 102C786 27 973 154 1175 78" fill="none" stroke="#26385B" stroke-opacity="0.28" stroke-width="1.5"/>
    <g opacity="0.18" stroke="#9FB4D7" stroke-width="1">
      <path d="M86 62V360M126 62V360M166 62V360M206 62V360M246 62V360M286 62V360M326 62V360M366 62V360M406 62V360M446 62V360M486 62V360M526 62V360M566 62V360M606 62V360M646 62V360M686 62V360M726 62V360M766 62V360M806 62V360M846 62V360M886 62V360M926 62V360M966 62V360M1006 62V360M1046 62V360M1086 62V360"/>
      <path d="M78 82H1122M78 122H1122M78 162H1122M78 202H1122M78 242H1122M78 282H1122M78 322H1122M78 362H1122"/>
    </g>
  </g>

  <g transform="translate(110 83)">
    <text class="eyebrow" fill="#8DA2C8">SELF-HOSTED · NO TRACKING PIXEL · OPEN SOURCE</text>
    <text class="title" y="56" fill="url(#headline)">github-traffic</text>
    <text class="title" y="99" fill="url(#headline)">archive</text>
    <text class="copy" y="130" fill="#D7E2F4">GitHub remembers 14 days.</text>
    <text class="copy" y="153" fill="#D7E2F4">Your repository remembers forever.</text>

    <g transform="translate(0 170)">
      <rect width="365" height="83" rx="14" fill="#091224" fill-opacity="0.94" stroke="#304263"/>
      <circle cx="20" cy="19" r="4" fill="#FB7185"/>
      <circle cx="34" cy="19" r="4" fill="#FBBF24"/>
      <circle cx="48" cy="19" r="4" fill="#34D399"/>
      <text class="small" x="20" y="46" fill="#7DD3FC">$ traffic-archive --repos owner/repo</text>
      <text class="small" x="20" y="68" fill="#A7F3D0">✓ 26 views · 73 clones · archived</text>
      <rect class="cursor" x="329" y="57" width="7" height="14" rx="1" fill="#34D399"/>
    </g>
  </g>

  <g class="float" transform="translate(542 91)">
    <rect width="340" height="210" rx="20" fill="#091224" fill-opacity="0.94" stroke="#33466D" filter="url(#shadow)"/>
    <text class="eyebrow" x="24" y="33" fill="#8DA2C8">ROLLING WINDOW</text>
    <text class="small" x="276" y="33" fill="#FBBF24">14 DAYS</text>
    <path d="M24 52H316" stroke="#26385B"/>

    <g transform="translate(25 78)">
      <rect x="0" y="53" width="12" height="28" rx="3" fill="#64748B" opacity=".45"/>
      <rect x="20" y="47" width="12" height="34" rx="3" fill="#64748B" opacity=".5"/>
      <rect x="40" y="55" width="12" height="26" rx="3" fill="#64748B" opacity=".55"/>
      <rect x="60" y="44" width="12" height="37" rx="3" fill="#64748B" opacity=".6"/>
      <rect x="80" y="35" width="12" height="46" rx="3" fill="#64748B" opacity=".66"/>
      <rect x="100" y="48" width="12" height="33" rx="3" fill="#64748B" opacity=".7"/>
      <rect x="120" y="28" width="12" height="53" rx="3" fill="#64748B" opacity=".75"/>
      <rect x="140" y="39" width="12" height="42" rx="3" fill="#64748B" opacity=".8"/>
      <rect class="bar-c" x="160" y="18" width="12" height="63" rx="3" fill="#8B5CF6"/>
      <rect class="bar-b" x="180" y="31" width="12" height="50" rx="3" fill="#7C9CF5"/>
      <rect class="bar-a" x="200" y="9" width="12" height="72" rx="3" fill="#38BDF8"/>
      <rect class="bar-b" x="220" y="25" width="12" height="56" rx="3" fill="#2DD4BF"/>
      <rect class="bar-c" x="240" y="43" width="12" height="38" rx="3" fill="#34D399"/>
      <rect class="bar-a" x="260" y="16" width="12" height="65" rx="3" fill="#34D399"/>
      <path d="M0 87H274" stroke="#33466D"/>
      <text class="micro" x="0" y="106" fill="#7183A5">DAY 01</text>
      <text class="micro" x="234" y="106" fill="#7DD3FC">DAY 14</text>
    </g>
  </g>

  <path class="flow-line" d="M861 326C904 351 925 348 959 324" fill="none" stroke="url(#flowGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12"/>
  <circle class="signal" cx="912" cy="343" r="5" fill="#7DD3FC" filter="url(#softGlow)"/>

  <g class="float" transform="translate(951 224)">
    <path d="M7 35V17C7 10.373 12.373 5 19 5H57L68 17H109C115.627 17 121 22.373 121 29V108C121 114.627 115.627 120 109 120H19C12.373 120 7 114.627 7 108V35Z" fill="#0D2A2B" stroke="#34D399" stroke-width="2"/>
    <path d="M8 38H120" stroke="#34D399" stroke-opacity=".6"/>
    <circle class="check" cx="64" cy="71" r="24" fill="#34D399" fill-opacity=".14" stroke="#34D399"/>
    <path d="M53 71L61 79L77 61" fill="none" stroke="#A7F3D0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="small" x="64" y="108" text-anchor="middle" fill="#A7F3D0">VERIFIED</text>
  </g>

  <g transform="translate(109 347)">
    <circle cx="6" cy="-4" r="6" fill="#34D399" filter="url(#softGlow)"/>
    <text class="small" x="21" fill="#9EB0CE">JSON + CSV</text>
    <circle cx="133" cy="-4" r="6" fill="#60A5FA"/>
    <text class="small" x="148" fill="#9EB0CE">DAILY SNAPSHOTS</text>
    <circle cx="310" cy="-4" r="6" fill="#A78BFA"/>
    <text class="small" x="325" fill="#9EB0CE">SIGSTORE PROVENANCE</text>
  </g>
</svg>
